name: TRAE 每日签到
on:
  schedule:
    # 每天 18:37 UTC = 次日 02:37 北京时间（错峰签到，避开 8 点整的限流高峰）
    - cron: '37 18 * * *'
  workflow_dispatch: # 支持手动触发
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      # refreshToken 是轮换链：每次续期都会生成新值、旧值逐渐失效。
      # Actions 每次都是全新环境，必须持久化轮换后的凭证，否则会一直用最初（越来越旧）的 token。
      # 缓存用 TRAE_CACHE_KEY 加密，避免明文 token 留在 Actions 缓存里。
      - name: 恢复轮换凭证缓存（加密）
        id: restore_auth
        uses: actions/cache/restore@v4
        with:
          path: auths.enc
          key: trae-auths-${{ github.run_id }}
          restore-keys: |
            trae-auths-

      - name: 生成/解密凭证
        id: prep
        env:
          TRAE_CACHE_KEY: ${{ secrets.TRAE_CACHE_KEY }}
          TRAE_AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          TRAE_AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          TRAE_AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
        run: |
          mkdir -p auths
          restored=0
          if [ -f auths.enc ] && [ -n "$TRAE_CACHE_KEY" ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in auths.enc -pass env:TRAE_CACHE_KEY -out auths.tar.gz 2>/dev/null; then
              if tar -xzf auths.tar.gz -C . 2>/dev/null; then
                restored=1
              fi
            fi
            rm -f auths.tar.gz
          fi
          if [ "$restored" -eq 1 ] && ls auths/trae-*.json >/dev/null 2>&1; then
            echo "已从缓存恢复轮换后的凭证（$(ls -1 auths/trae-*.json | wc -l) 个）"
          else
            rm -f auths/trae-*.json
            # 只为已配置的 secret 生成凭证文件，避免空文件导致解析报错
            n=0
            for i in 1 2 3; do
              var="TRAE_AUTH_$i"
              val="${!var:-}"
              if [ -n "$val" ]; then
                printf '%s\n' "$val" > "auths/trae-$i.json"
                n=$((n+1))
                echo "已写入 auths/trae-$i.json（来自 secrets）"
              fi
            done
            echo "共写入 $n 个凭证文件"
          fi
          if [ -n "$TRAE_CACHE_KEY" ]; then
            echo "cache_key_present=1" >> "$GITHUB_OUTPUT"
          else
            echo "cache_key_present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 TRAE_CACHE_KEY，轮换后的凭证不会持久化（建议配置以长期稳定）"
          fi

      - name: 执行签到
        run: |
          mkdir -p /tmp/signin
          ./signin_bin auths 2>&1 | tee /tmp/signin/output.txt
      - name: 提取结果
        id: result
        run: |
          OUT=$(cat /tmp/signin/output.txt)
          total=$(echo "$OUT" | grep -oP '总计=\K\d+' | head -1 || echo "0")
          ok=$(echo "$OUT" | grep -oP '签到成功=\K\d+' | head -1 || echo "0")
          already=$(echo "$OUT" | grep -oP '已签=\K\d+' | head -1 || echo "0")
          fail=$(echo "$OUT" | grep -oP '失败=\K\d+' | head -1 || echo "0")

          echo "total=$total"     >> "$GITHUB_OUTPUT"
          echo "ok=$ok"           >> "$GITHUB_OUTPUT"
          echo "already=$already" >> "$GITHUB_OUTPUT"
          echo "fail=$fail"       >> "$GITHUB_OUTPUT"
      - name: ntfy 通知
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "未配置 NTFY_URL，跳过推送"
            exit 0
          fi
          FAIL="${{ steps.result.outputs.fail }}"
          # 定时兜底（schedule）：当日已签且无失败时不推送，避免 GitHub 调度延迟造成的迟到通知
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${FAIL:-0}" = "0" ] && [ "${{ steps.result.outputs.ok || '0' }}" = "0" ]; then
            echo "定时兜底：当日已签到，跳过通知"
            exit 0
          fi
          if [ "$FAIL" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
            TAG="warning"
          else
            TITLE="✅ TRAE签到完成"
            TAG="white_check_mark"
          fi
          # 从签到输出表格提取每个账号：昵称 状态 剩余积分
          ACCOUNTS=""
          if [ -f /tmp/signin/output.txt ]; then
            while IFS= read -r line; do
              if echo "$line" | grep -qP '│\s+\d+'; then
                nick=$(echo "$line" | sed 's/│/\n/g' | sed -n '3p' | xargs)
                status=$(echo "$line" | sed 's/│/\n/g' | sed -n '4p' | xargs)
                credits=$(echo "$line" | sed 's/│/\n/g' | sed -n '5p' | xargs)
                ACCOUNTS="${ACCOUNTS}${nick} ${status} 剩余${credits}\n"
              fi
            done < /tmp/signin/output.txt
          fi
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 失败${{ steps.result.outputs.fail }}"
          if [ -n "$ACCOUNTS" ]; then
            BODY="${BODY}\n${ACCOUNTS}"
          fi
          echo "最终推送: $TITLE | $BODY"
          # ntfy：标题走 Title header，正文用 %b 把 \n 还原成真实换行
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Title: $TITLE" -H "Tags: $TAG" -d "$(printf '%b' "$BODY")" "$NTFY_URL") || true
          echo "ntfy HTTP 状态: $HTTP_CODE（200 即成功）"

      # 把本次运行轮换后的凭证加密后写回缓存，供下次运行继续续期（保持 refreshToken 链不断）
      - name: 加密轮换凭证
        if: always() && steps.prep.outputs.cache_key_present == '1'
        env:
          TRAE_CACHE_KEY: ${{ secrets.TRAE_CACHE_KEY }}
        run: |
          rm -f auths.enc
          if ls auths/trae-*.json >/dev/null 2>&1; then
            tar -czf auths.tar.gz auths
            openssl enc -aes-256-cbc -pbkdf2 -salt -in auths.tar.gz -pass env:TRAE_CACHE_KEY -out auths.enc
            rm -f auths.tar.gz
            echo "已加密轮换后的凭证"
          else
            echo "无可保存凭证"
          fi
      - name: 写入缓存
        if: always() && steps.prep.outputs.cache_key_present == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: auths.enc
          key: trae-auths-${{ github.run_id }}
      - name: 清理明文凭证
        if: always()
        run: rm -rf auths
