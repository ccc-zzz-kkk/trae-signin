name: TRAE 每日签到
on:
  schedule:
    # 每天 00:00 UTC = 08:00 北京时间
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin
      - name: 生成凭证文件
        env:
          TRAE_AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          TRAE_AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          TRAE_AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
        run: |
          mkdir -p auths
          # 只为已配置的 secret 生成凭证文件，避免空文件导致解析报错
          n=0
          for i in 1 2 3; do
            var="TRAE_AUTH_$i"
            val="${!var:-}"
            if [ -n "$val" ]; then
              printf '%s\n' "$val" > "auths/trae-$i.json"
              n=$((n+1))
              echo "已写入 auths/trae-$i.json"
            fi
          done
          echo "共写入 $n 个凭证文件"
      - name: 执行签到
        run: |
          mkdir -p /tmp/signin
          ./signin_bin auths 2>&1 | tee /tmp/signin/output.txt
      - name: 提取结果
        id: result
        run: |
          OUT=$(cat /tmp/signin/output.txt)
          total=$(echo "$OUT" | grep -oP '总计=\K\d+' | head -1 || echo "0")
          ok=$(echo "$OUT" | grep -oP '签到成功=\K\d+' | head -1 || echo "0")
          already=$(echo "$OUT" | grep -oP '已签=\K\d+' | head -1 || echo "0")
          fail=$(echo "$OUT" | grep -oP '失败=\K\d+' | head -1 || echo "0")

          echo "total=$total"     >> "$GITHUB_OUTPUT"
          echo "ok=$ok"           >> "$GITHUB_OUTPUT"
          echo "already=$already" >> "$GITHUB_OUTPUT"
          echo "fail=$fail"       >> "$GITHUB_OUTPUT"
      - name: ntfy 通知
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "未配置 NTFY_URL，跳过推送"
            exit 0
          fi
          FAIL="${{ steps.result.outputs.fail }}"
          if [ "$FAIL" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
            TAG="warning"
          else
            TITLE="✅ TRAE签到完成"
            TAG="white_check_mark"
          fi
          # 从签到输出表格提取每个账号：昵称 状态 剩余积分
          ACCOUNTS=""
          if [ -f /tmp/signin/output.txt ]; then
            while IFS= read -r line; do
              if echo "$line" | grep -qP '│\s+\d+'; then
                nick=$(echo "$line" | sed 's/│/\n/g' | sed -n '3p' | xargs)
                status=$(echo "$line" | sed 's/│/\n/g' | sed -n '4p' | xargs)
                credits=$(echo "$line" | sed 's/│/\n/g' | sed -n '5p' | xargs)
                ACCOUNTS="${ACCOUNTS}${nick} ${status} 剩余${credits}\n"
              fi
            done < /tmp/signin/output.txt
          fi
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 失败${{ steps.result.outputs.fail }}"
          if [ -n "$ACCOUNTS" ]; then
            BODY="${BODY}
${ACCOUNTS}"
          fi
          echo "最终推送: $TITLE | $BODY"
          # ntfy：标题走 Title header，正文用 %b 把 \n 还原成真实换行
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Title: $TITLE" -H "Tags: $TAG" -d "$(printf '%b' "$BODY")" "$NTFY_URL") || true
          echo "ntfy HTTP 状态: $HTTP_CODE（200 即成功）"
      - name: 清理凭证
        if: always()
        run: rm -rf auths
